[kora]
rate_limit = 20
cors_allow_origins = []

[kora.auth]

[kora.cache]
enabled = false
default_ttl = 300
account_ttl = 60

[validation]
price_source = "Jupiter"
max_allowed_lamports = 1000000
max_signatures = 3
allow_durable_transactions = false
allowed_programs = [
    "11111111111111111111111111111111",
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",
    "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL",
    "ComputeBudget111111111111111111111111111111",
]
allowed_tokens = [
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
]
allowed_spl_paid_tokens = [
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
]
disallowed_accounts = []

[validation.fee_payer_policy.system]
allow_transfer = false
allow_assign = false
allow_create_account = false
allow_allocate = false

[validation.fee_payer_policy.system.nonce]
allow_initialize = false
allow_advance = false
allow_authorize = false
allow_withdraw = false

[validation.fee_payer_policy.spl_token]
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = false
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false
allow_withdraw_excess_lamports = false
allow_unwrap_lamports = false

[validation.fee_payer_policy.token_2022]
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = false
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false
allow_withdraw_excess_lamports = false
allow_unwrap_lamports = false

[validation.fee_payer_policy.alt]
allow_create = false
allow_extend = false
allow_freeze = false
allow_deactivate = false
allow_close = false

[kora.enabled_methods]
liveness = true
estimate_transaction_fee = true
estimate_bundle_fee = false
get_supported_tokens = false
sign_transaction = false
sign_and_send_transaction = true
transfer_transaction = false
get_blockhash = true
get_config = true
get_payer_signer = true
get_version = true

[validation.price]
type = "margin"
margin = 0.10

[validation.token_2022]
transfer_hook_policy = "deny_all"
blocked_mint_extensions = [
    "confidential_transfer_mint",
    "confidential_mint_burn",
    "transfer_fee_config",
    "mint_close_authority",
    "interest_bearing_config",
    "non_transferable",
    "permanent_delegate",
    "transfer_hook",
    "pausable",
]
blocked_account_extensions = [
    "confidential_transfer_account",
    "non_transferable_account",
    "transfer_hook_account",
    "pausable_account",
    "memo_transfer",
    "cpi_guard",
    "default_account_state",
]

[metrics]
enabled = false

[kora.usage_limit]
enabled = false
fallback_if_unavailable = false
rules = []

[kora.bundle]
enabled = false
